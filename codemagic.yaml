workflows:
  android-workflow:
    name: Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Recuperer les paquets
        script: flutter pub get
      - name: Generer l icone
        script: dart run flutter_launcher_icons
      - name: Generer le splash
        script: dart run flutter_native_splash:create
      - name: Build APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  web-workflow:
    name: Version Web
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - firebase
    scripts:
      - name: Peupler Firestore — catalogue national + enrichissement pedagogique
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$CM_BUILD_DIR/cle_service_firebase.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$CM_BUILD_DIR/cle_service_firebase.json"
          npm install --prefix functions --no-audit --no-fund
          node functions/ensure_matieres_centre.js
          node functions/fix_catalogue_matieres.js
          node functions/enrich_contenu_prioritaire.js
          node functions/seed_math6e.js
          node functions/enrich_math6e_complet.js
          node functions/seed_math4e.js
          node functions/seed_math5e.js
          node functions/seed_math3e.js
          node functions/enrich_math_3e_4e.js
          node functions/seed_francais4e.js
          node functions/seed_francais3e.js
          node functions/seed_physique6e.js
          node functions/seed_physique4e.js
          node functions/seed_physique5e.js
          node functions/seed_physique3e.js
          node functions/seed_svt6e.js
          node functions/seed_svt5e.js
          node functions/seed_svt4e.js
          node functions/seed_svt3e.js
          node functions/seed_hg6e.js
          node functions/seed_hg5e.js
          node functions/seed_hg4e.js
          node functions/seed_hg3e.js
          node functions/seed_anglais6e.js
          node functions/seed_anglais5e.js
          node functions/seed_anglais4e.js
          node functions/seed_anglais3e.js
          node functions/seed_francais6e.js
          node functions/seed_francais5e.js
          node functions/seed_complementaires4e.js
          node functions/seed_complementaires_cycle1.js
          node functions/seed_premier_cycle_complet.js
          node functions/seed_second_cycle.js
          node functions/enrich_math_lycee.js
          node functions/enrich_philo_lycee.js
          node functions/audit_catalogue.js
          rm -f "$CM_BUILD_DIR/cle_service_firebase.json"
      - name: Recuperer les paquets
        script: |
          flutter pub cache repair
          flutter pub get
          flutter build web --release --no-web-resources-cdn
      - name: Rendre le site autonome (anti-blocage operateurs)
        script: python3 web_autonome.py
      - name: Compresser le site
        script: cd build && zip -r web_sentinel_ci.zip web
      - name: Deployer sur Firebase Hosting
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$CM_BUILD_DIR/cle_service_firebase.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$CM_BUILD_DIR/cle_service_firebase.json"
          npm install -g firebase-tools
          firebase deploy --only hosting --project sentinel-ci-c7592 --non-interactive
          rm -f "$CM_BUILD_DIR/cle_service_firebase.json"
    artifacts:
      - build/web_sentinel_ci.zip

  robots-workflow:
    name: Robots Notifications
    max_build_duration: 30
    environment:
      groups:
        - firebase
    scripts:
      - name: Preparer la cle Firebase
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$CM_BUILD_DIR/cle_service_firebase.json"
      - name: Installer les dependances des robots
        script: |
          npm install -g firebase-tools
          cd functions && npm install
      - name: Deployer les robots sur Firebase
        script: |
          export GOOGLE_APPLICATION_CREDENTIALS="$CM_BUILD_DIR/cle_service_firebase.json"
          firebase deploy --only functions --project sentinel-ci-c7592 --non-interactive --force
      - name: Autoriser les photos sur le site (reglage CORS)
        script: |
          export GOOGLE_APPLICATION_CREDENTIALS="$CM_BUILD_DIR/cle_service_firebase.json"
          npm install --prefix reglages google-auth-library
          node reglages/cors_storage.js
          rm -f "$CM_BUILD_DIR/cle_service_firebase.json"
