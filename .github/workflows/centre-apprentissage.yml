name: Sentinel CI - Centre d'Apprentissage

on:
  push:
    branches:
      - refonte/centre-apprentissage-2026-2027
  pull_request:
    branches:
      - master
      - refonte/centre-apprentissage-2026-2027

jobs:
  validate-centre-apprentissage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Validate catalogue
        run: dart run tool/validate_centre_apprentissage.dart

      - name: Flutter analyze
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.3
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze
